<script>
const DOCS = {"RU|terms": "<p>Редакция: 2.1<\/p>\n<p>Дата вступления в силу: 15 октября 2026 г.<\/p>\n<h3>1. Термины<\/h3>\n<p>Платформа — мобильное приложение TASK BOR для iOS и Android, сайт taskbor.uz и связанные с ними сервисы, включая Telegram-бот @taskborbot.<\/p>\n<p>Администрация — владелец и оператор Платформы: Муродов Элдор Мухсин угли, e-mail: emhsh1993@gmail.com.<\/p>\n<p>Пользователь — физическое лицо, зарегистрированное на Платформе.<\/p>\n<p>Заказчик — Пользователь, размещающий Заказ.<\/p>\n<p>Исполнитель — Пользователь, заполнивший анкету исполнителя и откликающийся на Заказы.<\/p>\n<p>Заказ — заявка Заказчика на бытовую или иную разрешённую услугу.<\/p>\n<p>Доска заказов — раздел, где Заказ виден всем подходящим Исполнителям рядом.<\/p>\n<p>Надёжность — показатель Исполнителя: доля выполненных заказов среди принятых.<\/p>\n<h3>2. Принятие условий<\/h3>\n<p>2.1. Соглашение — публичная оферта. Оно принимается, когда Пользователь отмечает согласие при регистрации и подтверждает номер телефона кодом из SMS.<\/p>\n<p>2.2. Без регистрации Платформу можно просматривать в гостевом режиме: категории, описание услуг, профили исполнителей. Для создания заказа, откликов, чата и отзывов нужна регистрация.<\/p>\n<p>2.3. Если Пользователь не согласен с условиями, он не должен регистрироваться и пользоваться Платформой.<\/p>\n<h3>3. Роль Платформы<\/h3>\n<p>3.1. TASK BOR — информационная площадка, которая помогает Заказчикам и Исполнителям найти друг друга и договориться об услуге.<\/p>\n<p>3.2. Администрация не является исполнителем или заказчиком услуг, работодателем, агентом, гарантом или платёжным посредником. Договор об услуге заключается напрямую между Заказчиком и Исполнителем.<\/p>\n<p>3.3. Объём, цену, сроки, качество и гарантии услуги определяют Заказчик и Исполнитель. Администрация не отвечает за исполнение их договорённостей, кроме случаев, прямо предусмотренных законом.<\/p>\n<p>3.4. Платформа не принимает, не хранит и не переводит деньги Пользователей. Оплата производится напрямую — наличными или переводом, по договорённости сторон. Сумма в приложении носит справочный характер.<\/p>\n<p>3.5. Сейчас Платформа бесплатна, комиссия не взимается. Если появятся платные функции или комиссия, Администрация заранее опубликует новую редакцию Соглашения и уведомит Пользователей в приложении.<\/p>\n<h3>4. Аккаунт<\/h3>\n<p>4.1. Пользоваться Платформой могут лица от 18 лет с полной дееспособностью.<\/p>\n<p>4.2. Вход — по номеру телефона и одноразовому коду из SMS. Один номер — один аккаунт. Передавать аккаунт другим лицам нельзя.<\/p>\n<p>4.3. В одном аккаунте две роли: Заказчик и Исполнитель. Переключение — в Профиле. Чтобы работать Исполнителем, нужно заполнить анкету: фото, категории услуг, районы или радиус работы, ставки, опыт и описание.<\/p>\n<p>4.4. Пользователь отвечает за достоверность своих данных и сохранность доступа к телефону. Никому не сообщайте код из SMS — сотрудники TASK BOR никогда его не запрашивают.<\/p>\n<h3>5. Как работает Заказ<\/h3>\n<p>5.1. Заказчик указывает категорию, описание задачи и при желании фото и голосовое сообщение, адрес (на карте), дату и время. Заказ может повторяться еженедельно или раз в две недели.<\/p>\n<p>5.2. Способы оплаты:<\/p>\n<ul><li>Почасовая — ставка Исполнителя × количество часов, минимум 2 часа. Фактические часы Исполнитель указывает при завершении.<\/li><li>Договорная — Заказчик указывает свою цену, Исполнитель соглашается или отказывается. Встречные предложения не предусмотрены.<\/li><\/ul>\n<p>5.3. Способы выбора исполнителя:<\/p>\n<ul><li>На карте или списком — Заказчик сам выбирает Исполнителя из тех, кто сейчас онлайн рядом.<\/li><li>Любой исполнитель — Заказ попадает на Доску заказов. Его получает тот, кто первым примет.<\/li><\/ul>\n<p>5.4. До принятия Исполнитель видит описание, фото, голосовое сообщение и примерное место (точность около 300 м), без номера дома и квартиры. После принятия Исполнитель получает точный адрес, имя и телефон Заказчика, открывается чат.<\/p>\n<p>5.5. Если Заказ никто не принял вовремя, он снимается автоматически со статусом «Истёк».<\/p>\n<p>5.6. Статусы: «Принят» → «В пути» → «В работе» → «Завершён». Статусы отражают договорённость, но не подтверждают качество работы или факт оплаты.<\/p>\n<p>5.7. Если заказ «В работе» не завершили вручную, через час после планового окончания обеим сторонам приходит напоминание, а через 24 часа заказ завершается автоматически по плановой цене. К оплате по почасовому заказу засчитывается не больше запланированных часов плюс 2 часа.<\/p>\n<p>5.8. Если работа по принятому заказу не была начата в течение 24 часов после времени начала, заказ отменяется автоматически. На «Надёжность» Исполнителя это не влияет.<\/p>\n<h3>6. Отмена заказа<\/h3>\n<p>6.1. Заказчик может отменить Заказ, указав причину.<\/p>\n<p>6.2. До принятия Исполнитель может просто отказаться. После принятия он направляет запрос на отмену с причиной, а решение принимает Заказчик: отменить или оставить Заказ.<\/p>\n<p>6.3. Отмена менее чем за 2 часа до начала считается поздней и отмечается в истории.<\/p>\n<p>6.4. Отмены Исполнителя учитываются в показателе «Надёжность». Он показывается в профиле после 5 принятых заказов и влияет на порядок в списках. Выполненные заказы считаются по разным Заказчикам: повторные заказы одного Заказчика в течение месяца засчитываются один раз. На звёздный рейтинг отмены не влияют.<\/p>\n<p>6.5. При систематических отменах или неявках Администрация может приостановить приём заказов Исполнителем (раздел 12).<\/p>\n<h3>7. Чат и общение<\/h3>\n<p>7.1. После принятия Заказа стороны общаются в чате: текст, фото, голосовые сообщения, реакции.<\/p>\n<p>7.2. Пользователь может пожаловаться на сообщение (долгое нажатие) и заблокировать собеседника.<\/p>\n<p>7.3. Сотрудники поддержки и модерации могут просматривать переписку по конкретному заказу только при рассмотрении жалобы, спора, обращения в поддержку или угрозы безопасности.<\/p>\n<p>7.4. Фото и голосовые сообщения в чате и в описании заказа хранятся 90 дней после закрытия заказа, затем удаляются. Текст переписки сохраняется.<\/p>\n<h3>8. Отзывы и рейтинг<\/h3>\n<p>8.1. После завершения Заказа Заказчик может оценить Исполнителя от 1 до 5 звёзд и оставить отзыв с фото. Звёздный рейтинг Исполнителя — среднее этих оценок.<\/p>\n<p>8.2. Если Заказ отменён по просьбе Исполнителя, Заказчик может оставить отзыв. Он виден в профиле, но не учитывается в среднем рейтинге.<\/p>\n<p>8.3. Администрация не редактирует отзывы. Отзыв может быть скрыт, только если он содержит оскорбления, угрозы, чужие персональные данные, рекламу, заведомо ложные сведения или иное нарушение закона либо Соглашения. Исполнитель может пожаловаться на отзыв через поддержку.<\/p>\n<p>8.4. Запрещено публиковать отзывы за вознаграждение, о себе или без реального заказа.<\/p>\n<p>8.5. Чтобы рейтинг был честным, в среднюю оценку не входят (но остаются видны в профиле): повторные отзывы одного Заказчика об одном Исполнителе чаще одного раза в 30 дней; отзывы по заказам, где Заказчик и Исполнитель пользуются одним телефоном; отзывы по заказам, закрытым быстрее чем через 15 минут после принятия или начала работы.<\/p>\n<h3>9. Порядок показа исполнителей и заказов<\/h3>\n<p>9.1. В списке и на карте показываются только Исполнители, которые сейчас онлайн, работают в нужной категории, в районе или радиусе Заказа и не приостановлены.<\/p>\n<p>9.2. Порядок в списке: сначала Исполнители с высокой «Надёжностью» (от 90%), затем с нормальной (80–89%) и новички, затем с низкой (ниже 80%). Внутри каждой группы — по рейтингу с учётом количества отзывов и по близости к месту заказа.<\/p>\n<p>9.3. «Популярные исполнители» на главном экране: по рейтингу и количеству выполненных заказов.<\/p>\n<p>9.4. Исполнитель видит заказы своих категорий в своих районах или радиусе, а также заказы, адресованные лично ему.<\/p>\n<p>9.5. Платного продвижения и рекламы в выдаче нет. Если оно появится, такие места будут помечены.<\/p>\n<h3>10. Правила для Исполнителей<\/h3>\n<p>10.1. Исполнитель самостоятельно решает, принимать ли Заказ, и сам отвечает за качество, безопасность и законность своих услуг, а также за уплату налогов.<\/p>\n<p>10.2. Если для услуги нужна лицензия, разрешение, допуск или регистрация (например, электромонтажные работы, газовое оборудование), Исполнитель обязан их иметь. Администрация вправе запросить подтверждающие документы и скрыть категорию или профиль до их предоставления.<\/p>\n<p>10.3. Отметка «онлайн» означает готовность принимать заказы. Исполнитель обязан приходить вовремя, а если не может — заранее сообщить через приложение.<\/p>\n<p>10.4. Использование Платформы не создаёт трудовых отношений с Администрацией.<\/p>\n<h3>11. Запрещено<\/h3>\n<ul><li>предлагать или заказывать незаконные, опасные или запрещённые к обороту услуги и товары, интимные услуги, услуги, связанные с оружием, наркотиками, алкоголем и табаком;<\/li><li>оказывать лицензируемые услуги без лицензии;<\/li><li>мошенничество, требование предоплаты под ложным предлогом, угрозы, вымогательство, оскорбления, дискриминация;<\/li><li>выдавать себя за другое лицо, использовать чужие фото и документы;<\/li><li>публиковать чужие персональные данные, спам, рекламу сторонних сервисов;<\/li><li>создавать несколько аккаунтов, обходить блокировки, вмешиваться в работу Платформы, собирать данные Пользователей.<\/li><\/ul>\n<h3>12. Модерация и ограничения<\/h3>\n<p>12.1. При жалобе, нарушении или угрозе безопасности Администрация вправе запросить объяснения, скрыть контент, приостановить приём заказов Исполнителем на определённый срок, заблокировать аккаунт.<\/p>\n<p>12.2. При блокировке за серьёзное нарушение может быть запрещена повторная регистрация с этим номером. Для этого хранится необратимый хеш номера, а не сам номер.<\/p>\n<p>12.3. Причина ограничения показывается в приложении. Обжаловать решение можно через поддержку.<\/p>\n<p>12.4. Жалобу можно подать в карточке заказа, на сообщение в чате или в поддержку. Администрация рассматривает её в разумный срок и сообщает итог в приложении. Гражданские споры между сторонами Администрация не разрешает, но может помочь с информацией в рамках закона.<\/p>\n<p>12.5. Платформа автоматически отмечает подозрительные действия (например, накрутку рейтинга, несколько аккаунтов на одном телефоне, массовые запросы SMS) для проверки сотрудником. Автоматических блокировок нет — решение всегда принимает сотрудник.<\/p>\n<h3>13. Безопасность<\/h3>\n<p>13.1. Рекомендуем: не платить до начала работ, если это не оговорено; проверять рейтинг, отзывы и «Надёжность»; общаться через чат TASK BOR; не сообщать коды из SMS и данные карт.<\/p>\n<p>13.2. При угрозе жизни, здоровью или имуществу немедленно звоните: 101 — пожарная служба, 102 — полиция, 103 — скорая помощь.<\/p>\n<h3>14. Ответственность<\/h3>\n<p>14.1. Администрация отвечает за работу Платформы и свои действия в пределах, установленных законодательством Республики Узбекистан.<\/p>\n<p>14.2. Администрация не гарантирует наличие заказов или исполнителей, качество, безопасность и сроки услуг, факт оплаты.<\/p>\n<p>14.3. Платформа предоставляется «как есть». Возможны перерывы на обновления и технические работы.<\/p>\n<p>14.4. Ничто в Соглашении не ограничивает ответственность, которую нельзя ограничить по закону, и права потребителей.<\/p>\n<h3>15. Интеллектуальная собственность<\/h3>\n<p>15.1. Права на Платформу, дизайн, код, название и логотип TASK BOR принадлежат Администрации.<\/p>\n<p>15.2. Размещая фото, описания и отзывы, Пользователь предоставляет Администрации безвозмездную неисключительную лицензию использовать их для работы Платформы: показа в приложении, в профиле Исполнителя, модерации — на время их размещения. Для рекламы за пределами приложения нужно отдельное согласие.<\/p>\n<h3>16. Изменение условий и удаление аккаунта<\/h3>\n<p>16.1. Администрация может изменять Соглашение при изменении функций или законодательства. О существенных изменениях Пользователь будет уведомлён в приложении не позднее чем за 7 дней. Продолжение использования означает согласие с новой редакцией.<\/p>\n<p>16.2. Пользователь может в любой момент удалить аккаунт: Профиль → Удалить аккаунт. Что происходит с данными, описано в Политике конфиденциальности.<\/p>\n<h3>17. Применимое право и контакты<\/h3>\n<p>17.1. Соглашение регулируется законодательством Республики Узбекистан.<\/p>\n<p>17.2. Споры с Администрацией сначала решаются через претензию на e-mail. Если спор не урегулирован, он передаётся в суд по законодательству Республики Узбекистан.<\/p>\n<p>17.3. Контакты: поддержка в приложении (Профиль → Поддержка), e-mail emhsh1993@gmail.com, сайт taskbor.uz.<\/p>", "RU|privacy": "<p>Редакция: 2.1<\/p>\n<p>Дата вступления в силу: 15 октября 2026 г.<\/p>\n<h3>1. Кто обрабатывает данные<\/h3>\n<p>Оператор и собственник персональных данных — Муродов Элдор Мухсин угли (TASK BOR), e-mail: emhsh1993@gmail.com.<\/p>\n<p>Политика действует для приложения TASK BOR, сайта taskbor.uz и Telegram-бота @taskborbot. Она составлена в соответствии с Законом Республики Узбекистан «О персональных данных».<\/p>\n<h3>2. Какие данные мы собираем<\/h3>\n<p>При регистрации: номер телефона, имя, язык интерфейса, отметка о согласии (дата, редакция документов, язык).<\/p>\n<p>Профиль: фото (по желанию).<\/p>\n<p>Анкета исполнителя: категории, районы или радиус работы, ставки, опыт, описание, статус онлайн/офлайн.<\/p>\n<p>Геолокация исполнителя: пока Исполнитель онлайн и приложение открыто, координаты обновляются, чтобы подбирать заказы по радиусу и показывать расстояние. Фоновое отслеживание не используется.<\/p>\n<p>Адреса: адрес заказа (район, улица, дом, квартира, ориентир, комментарий, точка на карте), сохранённые адреса.<\/p>\n<p>Заказы: категория, описание, фото, голосовое сообщение, дата и время, цена, статусы, причины отмен.<\/p>\n<p>Общение: сообщения в чате (текст, фото, голос), реакции, переписка с поддержкой.<\/p>\n<p>Отзывы и жалобы: оценки, тексты, фото, причины и описания жалоб.<\/p>\n<p>Прочее: избранные исполнители, заблокированные пользователи, история уведомлений.<\/p>\n<p>Технические данные: токен push-уведомлений, IP-адрес, модель устройства, случайный идентификатор установки приложения (нужен, чтобы аккаунт был открыт только на одном телефоне), версия ОС и приложения, журналы входа и действий, необходимые для безопасности, технические отчёты о сбоях приложения и сервера. Если Исполнитель подключил Telegram-бота — идентификатор чата Telegram.<\/p>\n<p>Мы НЕ собираем: данные банковских карт, паспортные данные, контакты телефонной книги, фоновую геолокацию, рекламный идентификатор. Сторонних систем аналитики и рекламных трекеров в приложении нет. Голосовые сообщения не используются для биометрической идентификации.<\/p>\n<h3>3. Разрешения на устройстве<\/h3>\n<p>Все разрешения необязательны и запрашиваются только в момент использования функции. Их можно отключить в настройках телефона.<\/p>\n<ul><li>Геолокация («при использовании») — точка заказа на карте, исполнители рядом, работа Исполнителя онлайн.<\/li><li>Камера и галерея — фото задачи, профиля, отзыва или фото в чате.<\/li><li>Микрофон — только во время записи голосового сообщения.<\/li><li>Уведомления — новые заказы, статусы, сообщения.<\/li><\/ul>\n<h3>4. Зачем мы это делаем<\/h3>\n<ul><li>регистрация и вход;<\/li><li>создание заказов, подбор и показ исполнителей и заказов рядом, работа доски заказов;<\/li><li>чат, уведомления, поддержка;<\/li><li>рейтинг, отзывы, показатель «Надёжность»;<\/li><li>рассмотрение жалоб и споров, модерация, защита от мошенничества и повторной регистрации нарушителей;<\/li><li>автоматическая проверка на накрутку рейтинга и спам (например, совпадение телефона у Заказчика и Исполнителя) — решение по ней всегда принимает сотрудник;<\/li><li>стабильность и безопасность Платформы;<\/li><li>исполнение требований законодательства.<\/li><\/ul>\n<p>Мы не продаём персональные данные и не используем их для рекламы.<\/p>\n<p>Основания обработки: согласие Пользователя, исполнение Соглашения, требования закона, а также защита прав и законных интересов Пользователей и Оператора.<\/p>\n<h3>5. Кто видит ваши данные<\/h3>\n<p>Другие Пользователи:<\/p>\n<ul><li>Профиль Исполнителя видят все: имя, фото, категории, ставки, опыт, описание, рейтинг, «Надёжность», отзывы.<\/li><li>До принятия заказа Исполнитель видит описание, фото, голосовое сообщение и примерную точку (около 300 м), без дома и квартиры.<\/li><li>После принятия Исполнитель видит точный адрес, имя и телефон Заказчика.<\/li><li>Заказчик видит примерное расстояние до Исполнителя. Точные координаты Исполнителя Заказчику не передаются. Телефон Исполнителя Заказчику не показывается — общение идёт через чат.<\/li><li>Отзыв виден в профиле Исполнителя вместе с именем Заказчика.<\/li><\/ul>\n<p>Сотрудники TASK BOR (владелец, модераторы, поддержка) — доступ по ролям, только в объёме, нужном для работы. Действия сотрудников записываются в журнал.<\/p>\n<p>Технические партнёры — только для работы сервиса:<\/p>\n<ul><li>Supabase — база данных, хранение фото и голосовых сообщений (Сингапур);<\/li><li>Render — сервер приложения (Сингапур);<\/li><li>Eskiz.uz — отправка SMS с кодом (Узбекистан);<\/li><li>Expo, Google Firebase, Apple — доставка push-уведомлений (США);<\/li><li>Sentry (Functional Software, Inc.) — диагностика сбоев приложения и сервера: техническое описание ошибки, модель устройства, версия ОС и приложения, внутренний идентификатор пользователя; имя, номер телефона и переписка не передаются (данные хранятся в ЕС);<\/li><li>Google Maps (Android), Apple Maps (iOS) — показ карты и определение адреса по точке (США);<\/li><li>Telegram — уведомления о заказах, если Исполнитель подключил бота.<\/li><\/ul>\n<p>Государственные органы — только по запросу и в порядке, установленных законом.<\/p>\n<h3>6. Хранение за рубежом и защита<\/h3>\n<p>6.1. Часть данных хранится на серверах за пределами Узбекистана (см. раздел 5). Это допускается законодательством Республики Узбекистан при соблюдении требований информационной безопасности. Биометрические и генетические данные Платформа не обрабатывает.<\/p>\n<p>6.2. Меры защиты: шифрование соединений (HTTPS), хранение кодов входа только в виде хеша со сроком действия 2 минуты, защищённое хранение токена сессии на устройстве, ограничение числа попыток и запросов, разграничение доступа сотрудников и журнал их действий, скрытие точного адреса до принятия заказа.<\/p>\n<p>6.3. Абсолютной защиты не даёт ни один способ передачи и хранения данных. При утечке, затрагивающей ваши права, мы уведомим вас и уполномоченный орган в порядке, установленном законом.<\/p>\n<h3>7. Сроки хранения<\/h3>\n<ul><li>Данные аккаунта хранятся, пока аккаунт существует.<\/li><li>Код из SMS — 2 минуты.<\/li><li>Журнал отправки SMS — 7 дней.<\/li><li>Уведомления в приложении — 90 дней.<\/li><li>Фото и голосовые сообщения в чате и в описании заказа — 90 дней после закрытия заказа. Фото отзывов и профиля хранятся, пока существует аккаунт.<\/li><li>Резервные копии перезаписываются в цикле, установленном провайдером.<\/li><\/ul>\n<h3>8. Удаление аккаунта<\/h3>\n<p>8.1. Удалить аккаунт можно в приложении (Профиль → Удалить аккаунт) или через страницу taskbor.uz/delete-account.html. Если нет доступа к приложению — напишите на emhsh1993@gmail.com с номера, привязанного к аккаунту.<\/p>\n<p>8.2. Сразу после удаления:<\/p>\n<ul><li>имя заменяется на «Удалённый пользователь», номер телефона и фото удаляются;<\/li><li>удаляются тексты, фото и голосовые в ваших сообщениях, ваши реакции, переписка с поддержкой;<\/li><li>удаляются тексты и фото ваших отзывов, текст ваших жалоб;<\/li><li>удаляются анкета исполнителя, геолокация, сохранённые адреса, избранное, уведомления, push-токен, привязка Telegram;<\/li><li>в ваших заказах удаляются номер дома, квартира, заметки, фото и голосовые сообщения;<\/li><li>все сессии на устройствах завершаются.<\/li><\/ul>\n<p>8.3. Остаются обезличенные записи о заказах (категория, дата, район и улица, статус, цена) и звёздная оценка без текста. Они нужны второй стороне заказа для истории и споров и для корректного рейтинга Исполнителя.<\/p>\n<p>8.4. Если аккаунт был заблокирован за серьёзное нарушение, хранится необратимый хеш номера телефона, чтобы предотвратить повторную регистрацию.<\/p>\n<p>8.5. Если вы были Исполнителем, мы храним необратимый хеш номера телефона и обезличенную историю Исполнителя (рейтинг, отзывы без текста, выполненные и отменённые заказы, пауза приёма заказов): 60 дней, а если на момент удаления рейтинг был ниже 4.0, надёжность ниже 70%, действовала пауза или были жалобы заказчиков, — 12 месяцев. Если в этот срок вы снова зарегистрируетесь с тем же номером, история Исполнителя вернётся к вашему аккаунту; в случае с нарушениями режим исполнителя откроется через 30 дней после удаления. Это защищает заказчиков от «обнуления» рейтинга удалением аккаунта.<\/p>\n<p>8.6. Чтобы нарушители не возвращались, у любого удалённого аккаунта 12 месяцев хранится необратимый хеш номера телефона. Если аккаунт заблокирован за серьёзное нарушение, вместе с хешем номера хранится случайный идентификатор установки приложения на его телефоне: вход другого аккаунта с этого телефона проверяет модератор.<\/p>\n<h3>9. Ваши права<\/h3>\n<p>Вы вправе:<\/p>\n<ul><li>узнать, какие ваши данные обрабатываются и как;<\/li><li>исправить или обновить их (большинство — прямо в Профиле);<\/li><li>отозвать согласие и удалить аккаунт;<\/li><li>потребовать прекратить незаконную обработку;<\/li><li>обжаловать действия Оператора в уполномоченном государственном органе или суде.<\/li><\/ul>\n<p>Запросы направляйте через поддержку в приложении или на emhsh1993@gmail.com. Для защиты ваших данных мы можем попросить подтвердить, что вы владелец аккаунта. Ответ — в сроки, установленные законодательством.<\/p>\n<h3>10. Возраст<\/h3>\n<p>Платформа предназначена для лиц от 18 лет. Если мы узнаем, что аккаунт создан несовершеннолетним, он будет удалён.<\/p>\n<h3>11. Изменения и контакты<\/h3>\n<p>При изменении функций, партнёров или законодательства мы обновляем Политику, указывая номер редакции и дату. О существенных изменениях сообщаем в приложении.<\/p>\n<p>Вопросы о персональных данных: поддержка в приложении, emhsh1993@gmail.com, taskbor.uz.<\/p>", "UZ|terms": "<p>Tahrir: 2.1<\/p>\n<p>Kuchga kirish sanasi: 2026-yil 15-oktabr<\/p>\n<h3>1. Atamalar<\/h3>\n<p>Platforma — iOS va Android uchun TASK BOR mobil ilovasi, taskbor.uz sayti va ular bilan bogʻliq xizmatlar, jumladan @taskborbot Telegram-boti.<\/p>\n<p>Maʻmuriyat — Platforma egasi va operatori: Murodov Eldor Muxsin oʻgʻli, e-mail: emhsh1993@gmail.com.<\/p>\n<p>Foydalanuvchi — Platformada roʻyxatdan oʻtgan jismoniy shaxs.<\/p>\n<p>Mijoz — Buyurtma joylashtiruvchi Foydalanuvchi.<\/p>\n<p>Ijrochi — ijrochi anketasini toʻldirgan va Buyurtmalarga javob beruvchi Foydalanuvchi.<\/p>\n<p>Buyurtma — Mijozning maishiy yoki boshqa ruxsat etilgan xizmatga arizasi.<\/p>\n<p>Buyurtmalar doskasi — Buyurtma yaqin atrofdagi barcha mos Ijrochilarga koʻrinadigan boʻlim.<\/p>\n<p>Ishonchlilik — Ijrochi koʻrsatkichi: qabul qilingan buyurtmalar ichida bajarilganlari ulushi.<\/p>\n<h3>2. Shartlarni qabul qilish<\/h3>\n<p>2.1. Kelishuv — ommaviy oferta. Foydalanuvchi roʻyxatdan oʻtishda rozilik belgisini qoʻyib, telefon raqamini SMS-kod bilan tasdiqlaganda qabul qilingan hisoblanadi.<\/p>\n<p>2.2. Roʻyxatdan oʻtmasdan Platformani mehmon rejimida koʻrish mumkin: toifalar, xizmatlar tavsifi, ijrochilar profillari. Buyurtma yaratish, javob berish, chat va sharhlar uchun roʻyxatdan oʻtish kerak.<\/p>\n<p>2.3. Agar Foydalanuvchi shartlarga rozi boʻlmasa, roʻyxatdan oʻtmasligi va Platformadan foydalanmasligi kerak.<\/p>\n<h3>3. Platformaning roli<\/h3>\n<p>3.1. TASK BOR — Mijozlar va Ijrochilarga bir-birini topish va xizmat boʻyicha kelishishga yordam beruvchi axborot maydonchasi.<\/p>\n<p>3.2. Maʻmuriyat xizmat ijrochisi yoki buyurtmachisi, ish beruvchi, agent, kafil yoki toʻlov vositachisi emas. Xizmat boʻyicha shartnoma bevosita Mijoz va Ijrochi oʻrtasida tuziladi.<\/p>\n<p>3.3. Xizmat hajmi, narxi, muddati, sifati va kafolatlarini Mijoz va Ijrochi belgilaydi. Qonunda bevosita nazarda tutilgan hollardan tashqari, Maʻmuriyat ularning kelishuvlari bajarilishi uchun javob bermaydi.<\/p>\n<p>3.4. Platforma Foydalanuvchilarning pulini qabul qilmaydi, saqlamaydi va oʻtkazmaydi. Toʻlov bevosita — naqd yoki oʻtkazma orqali, tomonlar kelishuviga koʻra amalga oshiriladi. Ilovadagi summa maʻlumot uchun koʻrsatiladi.<\/p>\n<p>3.5. Hozir Platforma bepul, komissiya olinmaydi. Pullik funksiyalar yoki komissiya paydo boʻlsa, Maʻmuriyat Kelishuvning yangi tahririni oldindan eʻlon qiladi va Foydalanuvchilarni ilovada xabardor qiladi.<\/p>\n<h3>4. Akkaunt<\/h3>\n<p>4.1. Platformadan 18 yoshdan oshgan, toʻliq muomalaga layoqatli shaxslar foydalanishi mumkin.<\/p>\n<p>4.2. Kirish — telefon raqami va SMS orqali keladigan bir martalik kod bilan. Bitta raqam — bitta akkaunt. Akkauntni boshqa shaxslarga berish mumkin emas.<\/p>\n<p>4.3. Bitta akkauntda ikki rol bor: Mijoz va Ijrochi. Rol Profilda almashtiriladi. Ijrochi sifatida ishlash uchun anketani toʻldirish kerak: rasm, xizmat toifalari, tumanlar yoki ish radiusi, narxlar, tajriba va tavsif.<\/p>\n<p>4.4. Foydalanuvchi oʻz maʻlumotlarining toʻgʻriligi va telefoniga kirish xavfsizligi uchun javobgar. SMS-kodni hech kimga aytmang — TASK BOR xodimlari uni hech qachon soʻramaydi.<\/p>\n<h3>5. Buyurtma qanday ishlaydi<\/h3>\n<p>5.1. Mijoz toifa, vazifa tavsifi va xohishiga koʻra rasm va ovozli xabar, manzil (xaritada), sana va vaqtni koʻrsatadi. Buyurtma har hafta yoki ikki haftada bir takrorlanishi mumkin.<\/p>\n<p>5.2. Toʻlov usullari:<\/p>\n<ul><li>Soatbay — Ijrochi stavkasi × soatlar soni, kamida 2 soat. Haqiqiy soatlarni Ijrochi yakunlashda koʻrsatadi.<\/li><li>Kelishilgan narx — Mijoz oʻz narxini koʻrsatadi, Ijrochi rozi boʻladi yoki rad etadi. Qarshi takliflar nazarda tutilmagan.<\/li><\/ul>\n<p>5.3. Ijrochini tanlash usullari:<\/p>\n<ul><li>Xaritada yoki roʻyxatda — Mijoz hozir yaqin atrofda onlayn boʻlganlar orasidan Ijrochini oʻzi tanlaydi.<\/li><li>Istalgan ijrochi — Buyurtma Buyurtmalar doskasiga tushadi. Uni birinchi qabul qilgan oladi.<\/li><\/ul>\n<p>5.4. Qabul qilishdan oldin Ijrochi tavsif, rasmlar, ovozli xabar va taxminiy joyni (taxminan 300 m aniqlikda) koʻradi, uy va xonadon raqamisiz. Qabul qilgandan keyin Ijrochi aniq manzil, Mijozning ismi va telefonini oladi, chat ochiladi.<\/p>\n<p>5.5. Agar Buyurtmani hech kim oʻz vaqtida qabul qilmasa, u «Muddati oʻtgan» holati bilan avtomatik olib tashlanadi.<\/p>\n<p>5.6. Holatlar: «Qabul qilindi» → «Yoʻlda» → «Bajarilmoqda» → «Yakunlandi». Holatlar kelishuvni aks ettiradi, lekin ish sifati yoki toʻlov faktini tasdiqlamaydi.<\/p>\n<p>5.7. Agar «Bajarilmoqda» holatidagi buyurtma qoʻlda yakunlanmasa, rejadagi tugash vaqtidan bir soat oʻtib ikkala tomonga eslatma keladi, 24 soatdan keyin esa buyurtma rejadagi narx boʻyicha avtomatik yakunlanadi. Soatbay buyurtmada toʻlovga rejadagi soatlardan koʻpi bilan 2 soat ortiq hisoblanadi.<\/p>\n<p>5.8. Agar qabul qilingan buyurtma boʻyicha ish boshlanish vaqtidan keyin 24 soat ichida boshlanmasa, buyurtma avtomatik bekor qilinadi. Bu Ijrochining «Ishonchlilik» koʻrsatkichiga taʻsir qilmaydi.<\/p>\n<h3>6. Buyurtmani bekor qilish<\/h3>\n<p>6.1. Mijoz sababini koʻrsatib, Buyurtmani bekor qilishi mumkin.<\/p>\n<p>6.2. Qabul qilishdan oldin Ijrochi shunchaki rad etishi mumkin. Qabul qilgandan keyin u sababini koʻrsatib bekor qilish soʻrovini yuboradi, qarorni esa Mijoz qabul qiladi: bekor qilish yoki Buyurtmani qoldirish.<\/p>\n<p>6.3. Boshlanishiga 2 soatdan kam qolganda bekor qilish kech bekor qilish hisoblanadi va tarixda belgilanadi.<\/p>\n<p>6.4. Ijrochining bekor qilishlari «Ishonchlilik» koʻrsatkichida hisobga olinadi. U 5 ta qabul qilingan buyurtmadan keyin profilda koʻrsatiladi va roʻyxatlardagi tartibga taʻsir qiladi. Bajarilgan buyurtmalar turli Mijozlar boʻyicha hisoblanadi: bir Mijozning bir oy ichidagi takroriy buyurtmalari bir marta hisobga olinadi. Yulduzli reytingga bekor qilishlar taʻsir qilmaydi.<\/p>\n<p>6.5. Muntazam bekor qilish yoki kelmaslik holatlarida Maʻmuriyat Ijrochining buyurtma qabul qilishini toʻxtatib qoʻyishi mumkin (12-boʻlim).<\/p>\n<h3>7. Chat va muloqot<\/h3>\n<p>7.1. Buyurtma qabul qilingandan keyin tomonlar chatda muloqot qiladi: matn, rasm, ovozli xabarlar, reaksiyalar.<\/p>\n<p>7.2. Foydalanuvchi xabar ustidan shikoyat qilishi (uzoq bosish) va suhbatdoshni bloklashi mumkin.<\/p>\n<p>7.3. Qoʻllab-quvvatlash va moderatsiya xodimlari muayyan buyurtma boʻyicha yozishmani faqat shikoyat, nizo, qoʻllab-quvvatlashga murojaat yoki xavfsizlikka tahdid koʻrib chiqilayotganda koʻrishi mumkin.<\/p>\n<p>7.4. Chatdagi va buyurtma tavsifidagi rasm va ovozli xabarlar buyurtma yopilgandan keyin 90 kun saqlanadi, soʻng oʻchiriladi. Yozishma matni saqlanib qoladi.<\/p>\n<h3>8. Sharhlar va reyting<\/h3>\n<p>8.1. Buyurtma yakunlangach, Mijoz Ijrochini 1 dan 5 gacha yulduz bilan baholashi va rasm bilan sharh qoldirishi mumkin. Ijrochining yulduzli reytingi — shu baholarning oʻrtachasi.<\/p>\n<p>8.2. Agar Buyurtma Ijrochining iltimosiga koʻra bekor qilingan boʻlsa, Mijoz sharh qoldirishi mumkin. U profilda koʻrinadi, lekin oʻrtacha reytingda hisobga olinmaydi.<\/p>\n<p>8.3. Maʻmuriyat sharhlarni tahrirlamaydi. Sharh faqat haqorat, tahdid, begona shaxsiy maʻlumotlar, reklama, ataylab yolgʻon maʻlumot yoki qonun yoxud Kelishuvning boshqa buzilishini oʻz ichiga olsa yashirilishi mumkin. Ijrochi sharh ustidan qoʻllab-quvvatlash orqali shikoyat qilishi mumkin.<\/p>\n<p>8.4. Haq evaziga, oʻzingiz haqingizda yoki haqiqiy buyurtmasiz sharh joylash taqiqlanadi.<\/p>\n<p>8.5. Reyting halol boʻlishi uchun oʻrtacha bahoga quyidagilar kirmaydi (lekin profilda koʻrinib turadi): bir Mijozning bitta Ijrochi haqidagi 30 kunda bir martadan koʻp takroriy sharhlari; Mijoz va Ijrochi bitta telefondan foydalangan buyurtmalar boʻyicha sharhlar; qabul qilish yoki ish boshlanishidan keyin 15 daqiqadan tezroq yopilgan buyurtmalar boʻyicha sharhlar.<\/p>\n<h3>9. Ijrochilar va buyurtmalarni koʻrsatish tartibi<\/h3>\n<p>9.1. Roʻyxatda va xaritada faqat hozir onlayn boʻlgan, kerakli toifada, Buyurtma tumani yoki radiusida ishlaydigan va toʻxtatib qoʻyilmagan Ijrochilar koʻrsatiladi.<\/p>\n<p>9.2. Roʻyxatdagi tartib: avval «Ishonchlilik»i yuqori (90% dan) Ijrochilar, keyin oddiy (80–89%) va yangilar, keyin past (80% dan kam). Har bir guruh ichida — sharhlar soni hisobga olingan reyting va buyurtma joyiga yaqinlik boʻyicha.<\/p>\n<p>9.3. Bosh ekrandagi «Mashhur ijrochilar»: reyting va bajarilgan buyurtmalar soni boʻyicha.<\/p>\n<p>9.4. Ijrochi oʻz tumanlari yoki radiusidagi oʻz toifalari buyurtmalarini, shuningdek shaxsan unga yoʻllangan buyurtmalarni koʻradi.<\/p>\n<p>9.5. Natijalarda pullik targʻib va reklama yoʻq. Agar paydo boʻlsa, bunday oʻrinlar belgilanadi.<\/p>\n<h3>10. Ijrochilar uchun qoidalar<\/h3>\n<p>10.1. Ijrochi Buyurtmani qabul qilish-qilmaslikni mustaqil hal qiladi va oʻz xizmatlarining sifati, xavfsizligi va qonuniyligi, shuningdek soliqlarni toʻlash uchun oʻzi javob beradi.<\/p>\n<p>10.2. Agar xizmat uchun litsenziya, ruxsatnoma, ruxsat yoki roʻyxatdan oʻtish kerak boʻlsa (masalan, elektr montaj ishlari, gaz uskunalari), Ijrochi ularga ega boʻlishi shart. Maʻmuriyat tasdiqlovchi hujjatlarni soʻrashga va ular taqdim etilgunga qadar toifa yoki profilni yashirishga haqli.<\/p>\n<p>10.3. «Onlayn» belgisi buyurtmalarni qabul qilishga tayyorlikni bildiradi. Ijrochi oʻz vaqtida kelishi, kela olmasa — ilova orqali oldindan xabar berishi shart.<\/p>\n<p>10.4. Platformadan foydalanish Maʻmuriyat bilan mehnat munosabatlarini yuzaga keltirmaydi.<\/p>\n<h3>11. Taqiqlanadi<\/h3>\n<ul><li>noqonuniy, xavfli yoki muomalasi taqiqlangan xizmat va tovarlarni, intim xizmatlarni, qurol, giyohvand moddalar, alkogol va tamaki bilan bogʻliq xizmatlarni taklif qilish yoki buyurtma qilish;<\/li><li>litsenziyalanadigan xizmatlarni litsenziyasiz koʻrsatish;<\/li><li>firibgarlik, yolgʻon bahona bilan oldindan toʻlov talab qilish, tahdid, tovlamachilik, haqorat, kamsitish;<\/li><li>oʻzini boshqa shaxs qilib koʻrsatish, begona rasm va hujjatlardan foydalanish;<\/li><li>begona shaxsiy maʻlumotlar, spam, uchinchi tomon xizmatlari reklamasini joylash;<\/li><li>bir nechta akkaunt yaratish, bloklarni chetlab oʻtish, Platforma ishiga aralashish, Foydalanuvchilar maʻlumotlarini yigʻish.<\/li><\/ul>\n<h3>12. Moderatsiya va cheklovlar<\/h3>\n<p>12.1. Shikoyat, qoidabuzarlik yoki xavfsizlikka tahdid boʻlganda Maʻmuriyat tushuntirish soʻrashi, kontentni yashirishi, Ijrochining buyurtma qabul qilishini maʻlum muddatga toʻxtatishi, akkauntni bloklashi mumkin.<\/p>\n<p>12.2. Jiddiy qoidabuzarlik uchun bloklanganda shu raqam bilan qayta roʻyxatdan oʻtish taqiqlanishi mumkin. Buning uchun raqamning oʻzi emas, uning qaytarib boʻlmaydigan xeshi saqlanadi.<\/p>\n<p>12.3. Cheklov sababi ilovada koʻrsatiladi. Qarorni qoʻllab-quvvatlash orqali eʻtiroz qilish mumkin.<\/p>\n<p>12.4. Shikoyatni buyurtma kartochkasida, chatdagi xabar ustidan yoki qoʻllab-quvvatlashga yuborish mumkin. Maʻmuriyat uni oqilona muddatda koʻrib chiqadi va natijasini ilovada xabar qiladi. Tomonlar oʻrtasidagi fuqarolik nizolarini Maʻmuriyat hal qilmaydi, lekin qonun doirasida maʻlumot bilan yordam berishi mumkin.<\/p>\n<p>12.5. Platforma shubhali harakatlarni (masalan, reytingni sunʻiy oshirish, bitta telefonda bir nechta akkaunt, SMSni ommaviy soʻrash) xodim tekshirishi uchun avtomatik belgilaydi. Avtomatik bloklash yoʻq — qarorni har doim xodim qabul qiladi.<\/p>\n<h3>13. Xavfsizlik<\/h3>\n<p>13.1. Tavsiya qilamiz: kelishilmagan boʻlsa, ish boshlanishidan oldin toʻlamang; reyting, sharhlar va «Ishonchlilik»ni tekshiring; TASK BOR chati orqali muloqot qiling; SMS-kodlar va karta maʻlumotlarini aytmang.<\/p>\n<p>13.2. Hayot, sogʻliq yoki mulkka tahdid boʻlsa, darhol qoʻngʻiroq qiling: 101 — yongʻin xizmati, 102 — politsiya, 103 — tez yordam.<\/p>\n<h3>14. Javobgarlik<\/h3>\n<p>14.1. Maʻmuriyat Platforma ishi va oʻz harakatlari uchun Oʻzbekiston Respublikasi qonunchiligida belgilangan doirada javob beradi.<\/p>\n<p>14.2. Maʻmuriyat buyurtmalar yoki ijrochilar mavjudligini, xizmatlar sifati, xavfsizligi va muddatlarini, toʻlov faktini kafolatlamaydi.<\/p>\n<p>14.3. Platforma «boricha» taqdim etiladi. Yangilanishlar va texnik ishlar uchun tanaffuslar boʻlishi mumkin.<\/p>\n<p>14.4. Kelishuvdagi hech narsa qonunga koʻra cheklab boʻlmaydigan javobgarlikni va isteʻmolchilar huquqlarini cheklamaydi.<\/p>\n<h3>15. Intellektual mulk<\/h3>\n<p>15.1. Platforma, dizayn, kod, TASK BOR nomi va logotipiga boʻlgan huquqlar Maʻmuriyatga tegishli.<\/p>\n<p>15.2. Rasm, tavsif va sharhlarni joylab, Foydalanuvchi Maʻmuriyatga ulardan Platforma ishi uchun — ilovada, Ijrochi profilida koʻrsatish va moderatsiya uchun — joylangan muddat davomida foydalanishga bepul noeksklyuziv litsenziya beradi. Ilovadan tashqarida reklama uchun alohida rozilik kerak.<\/p>\n<h3>16. Shartlarni oʻzgartirish va akkauntni oʻchirish<\/h3>\n<p>16.1. Maʻmuriyat funksiyalar yoki qonunchilik oʻzgarganda Kelishuvni oʻzgartirishi mumkin. Muhim oʻzgarishlar haqida Foydalanuvchi ilovada kamida 7 kun oldin xabardor qilinadi. Foydalanishni davom ettirish yangi tahrirga rozilikni bildiradi.<\/p>\n<p>16.2. Foydalanuvchi istalgan vaqtda akkauntni oʻchirishi mumkin: Profil → Akkauntni oʻchirish. Maʻlumotlar bilan nima boʻlishi Maxfiylik siyosatida yozilgan.<\/p>\n<h3>17. Qoʻllaniladigan huquq va aloqa<\/h3>\n<p>17.1. Kelishuv Oʻzbekiston Respublikasi qonunchiligi bilan tartibga solinadi.<\/p>\n<p>17.2. Maʻmuriyat bilan nizolar avval e-mail orqali yuborilgan daʻvo bilan hal qilinadi. Nizo hal boʻlmasa, u Oʻzbekiston Respublikasi qonunchiligiga koʻra sudga beriladi.<\/p>\n<p>17.3. Aloqa: ilovadagi qoʻllab-quvvatlash (Profil → Yordam), e-mail emhsh1993@gmail.com, sayt taskbor.uz.<\/p>", "UZ|privacy": "<p>Tahrir: 2.1<\/p>\n<p>Kuchga kirish sanasi: 2026-yil 15-oktabr<\/p>\n<h3>1. Maʻlumotlarni kim qayta ishlaydi<\/h3>\n<p>Shaxsiy maʻlumotlar operatori va egasi — Murodov Eldor Muxsin oʻgʻli (TASK BOR), e-mail: emhsh1993@gmail.com.<\/p>\n<p>Siyosat TASK BOR ilovasi, taskbor.uz sayti va @taskborbot Telegram-botiga taalluqli. U Oʻzbekiston Respublikasining «Shaxsga doir maʻlumotlar toʻgʻrisida»gi Qonuniga muvofiq tuzilgan.<\/p>\n<h3>2. Qanday maʻlumotlarni yigʻamiz<\/h3>\n<p>Roʻyxatdan oʻtishda: telefon raqami, ism, interfeys tili, rozilik belgisi (sana, hujjatlar tahriri, til).<\/p>\n<p>Profil: rasm (ixtiyoriy).<\/p>\n<p>Ijrochi anketasi: toifalar, tumanlar yoki ish radiusi, narxlar, tajriba, tavsif, onlayn/oflayn holati.<\/p>\n<p>Ijrochi geolokatsiyasi: Ijrochi onlayn va ilova ochiq ekan, buyurtmalarni radius boʻyicha tanlash va masofani koʻrsatish uchun koordinatalar yangilanadi. Fonda kuzatish ishlatilmaydi.<\/p>\n<p>Manzillar: buyurtma manzili (tuman, koʻcha, uy, xonadon, moʻljal, izoh, xaritadagi nuqta), saqlangan manzillar.<\/p>\n<p>Buyurtmalar: toifa, tavsif, rasmlar, ovozli xabar, sana va vaqt, narx, holatlar, bekor qilish sabablari.<\/p>\n<p>Muloqot: chatdagi xabarlar (matn, rasm, ovoz), reaksiyalar, qoʻllab-quvvatlash bilan yozishma.<\/p>\n<p>Sharhlar va shikoyatlar: baholar, matnlar, rasmlar, shikoyat sabablari va tavsiflari.<\/p>\n<p>Boshqa: tanlangan ijrochilar, bloklangan foydalanuvchilar, bildirishnomalar tarixi.<\/p>\n<p>Texnik maʻlumotlar: push-bildirishnomalar tokeni, IP-manzil, qurilma modeli, ilova oʻrnatilishining tasodifiy identifikatori (akkaunt faqat bitta telefonda ochiq boʻlishi uchun kerak), OT va ilova versiyasi, xavfsizlik uchun zarur kirish va harakatlar jurnallari, ilova va server nosozliklari haqidagi texnik hisobotlar. Agar Ijrochi Telegram-botni ulagan boʻlsa — Telegram chat identifikatori.<\/p>\n<p>Biz YIGʻMAYMIZ: bank karta maʻlumotlari, pasport maʻlumotlari, telefon kitobidagi kontaktlar, fon geolokatsiyasi, reklama identifikatori. Ilovada uchinchi tomon analitika tizimlari va reklama trekerlari yoʻq. Ovozli xabarlar biometrik identifikatsiya uchun ishlatilmaydi.<\/p>\n<h3>3. Qurilmadagi ruxsatlar<\/h3>\n<p>Barcha ruxsatlar ixtiyoriy va faqat funksiyadan foydalanilganda soʻraladi. Ularni telefon sozlamalarida oʻchirish mumkin.<\/p>\n<ul><li>Geolokatsiya («foydalanilganda») — xaritadagi buyurtma nuqtasi, yaqin atrofdagi ijrochilar, Ijrochining onlayn ishi.<\/li><li>Kamera va galereya — vazifa, profil, sharh rasmi yoki chatdagi rasm.<\/li><li>Mikrofon — faqat ovozli xabar yozish vaqtida.<\/li><li>Bildirishnomalar — yangi buyurtmalar, holatlar, xabarlar.<\/li><\/ul>\n<h3>4. Bu nima uchun kerak<\/h3>\n<ul><li>roʻyxatdan oʻtish va kirish;<\/li><li>buyurtmalar yaratish, yaqin atrofdagi ijrochilar va buyurtmalarni tanlash va koʻrsatish, buyurtmalar doskasi ishi;<\/li><li>chat, bildirishnomalar, qoʻllab-quvvatlash;<\/li><li>reyting, sharhlar, «Ishonchlilik» koʻrsatkichi;<\/li><li>shikoyat va nizolarni koʻrib chiqish, moderatsiya, firibgarlik va qoidabuzarlarning qayta roʻyxatdan oʻtishidan himoya;<\/li><li>reytingni sunʻiy oshirish va spamni avtomatik tekshirish (masalan, Mijoz va Ijrochi telefonining bir xilligi) — u boʻyicha qarorni har doim xodim qabul qiladi;<\/li><li>Platformaning barqarorligi va xavfsizligi;<\/li><li>qonunchilik talablarini bajarish.<\/li><\/ul>\n<p>Biz shaxsiy maʻlumotlarni sotmaymiz va reklama uchun ishlatmaymiz.<\/p>\n<p>Qayta ishlash asoslari: Foydalanuvchi roziligi, Kelishuvni bajarish, qonun talablari, shuningdek Foydalanuvchilar va Operatorning huquq va qonuniy manfaatlarini himoya qilish.<\/p>\n<h3>5. Maʻlumotlaringizni kim koʻradi<\/h3>\n<p>Boshqa Foydalanuvchilar:<\/p>\n<ul><li>Ijrochi profilini hamma koʻradi: ism, rasm, toifalar, narxlar, tajriba, tavsif, reyting, «Ishonchlilik», sharhlar.<\/li><li>Buyurtma qabul qilinishidan oldin Ijrochi tavsif, rasmlar, ovozli xabar va taxminiy nuqtani (taxminan 300 m) koʻradi, uy va xonadonsiz.<\/li><li>Qabul qilgandan keyin Ijrochi aniq manzil, Mijozning ismi va telefonini koʻradi.<\/li><li>Mijoz Ijrochigacha boʻlgan taxminiy masofani koʻradi. Ijrochining aniq koordinatalari Mijozga berilmaydi. Ijrochining telefoni Mijozga koʻrsatilmaydi — muloqot chat orqali boʻladi.<\/li><li>Sharh Ijrochi profilida Mijoz ismi bilan birga koʻrinadi.<\/li><\/ul>\n<p>TASK BOR xodimlari (egasi, moderatorlar, qoʻllab-quvvatlash) — rollar boʻyicha, faqat ish uchun zarur hajmda kirish. Xodimlarning harakatlari jurnalga yoziladi.<\/p>\n<p>Texnik hamkorlar — faqat xizmat ishlashi uchun:<\/p>\n<ul><li>Supabase — maʻlumotlar bazasi, rasm va ovozli xabarlarni saqlash (Singapur);<\/li><li>Render — ilova serveri (Singapur);<\/li><li>Eskiz.uz — SMS-kod yuborish (Oʻzbekiston);<\/li><li>Expo, Google Firebase, Apple — push-bildirishnomalarni yetkazish (AQSh);<\/li><li>Sentry (Functional Software, Inc.) — ilova va server nosozliklarini tahlil qilish: xatoning texnik tavsifi, qurilma modeli, OT va ilova versiyasi, foydalanuvchining ichki identifikatori; ism, telefon raqami va yozishmalar uzatilmaydi (maʻlumotlar Yevropa Ittifoqida saqlanadi);<\/li><li>Google Maps (Android), Apple Maps (iOS) — xaritani koʻrsatish va nuqta boʻyicha manzilni aniqlash (AQSh);<\/li><li>Telegram — Ijrochi botni ulagan boʻlsa, buyurtmalar haqida bildirishnomalar.<\/li><\/ul>\n<p>Davlat organlari — faqat soʻrov boʻyicha va qonunda belgilangan tartibda.<\/p>\n<h3>6. Chet elda saqlash va himoya<\/h3>\n<p>6.1. Maʻlumotlarning bir qismi Oʻzbekistondan tashqaridagi serverlarda saqlanadi (5-boʻlimga qarang). Bunga Oʻzbekiston Respublikasi qonunchiligi axborot xavfsizligi talablariga rioya qilingan holda yoʻl qoʻyadi. Platforma biometrik va genetik maʻlumotlarni qayta ishlamaydi.<\/p>\n<p>6.2. Himoya choralari: ulanishlarni shifrlash (HTTPS), kirish kodlarini faqat 2 daqiqa amal qiladigan xesh shaklida saqlash, qurilmada sessiya tokenini himoyalangan saqlash, urinishlar va soʻrovlar sonini cheklash, xodimlar kirishini ajratish va ularning harakatlari jurnali, buyurtma qabul qilinguncha aniq manzilni yashirish.<\/p>\n<p>6.3. Maʻlumotlarni uzatish va saqlashning hech bir usuli mutlaq himoya bermaydi. Huquqlaringizga daxldor maʻlumot sizib chiqsa, sizni va vakolatli organni qonunda belgilangan tartibda xabardor qilamiz.<\/p>\n<h3>7. Saqlash muddatlari<\/h3>\n<ul><li>Akkaunt maʻlumotlari akkaunt mavjud ekan saqlanadi.<\/li><li>SMS-kod — 2 daqiqa.<\/li><li>SMS yuborish jurnali — 7 kun.<\/li><li>Ilovadagi bildirishnomalar — 90 kun.<\/li><li>Chatdagi va buyurtma tavsifidagi rasm va ovozli xabarlar — buyurtma yopilgandan keyin 90 kun. Sharh va profil rasmlari akkaunt mavjud ekan saqlanadi.<\/li><li>Zaxira nusxalar provayder belgilagan siklda qayta yoziladi.<\/li><\/ul>\n<h3>8. Akkauntni oʻchirish<\/h3>\n<p>8.1. Akkauntni ilovada (Profil → Akkauntni oʻchirish) yoki taskbor.uz/delete-account.html sahifasi orqali oʻchirish mumkin. Ilovaga kira olmasangiz — akkauntga bogʻlangan raqamdan emhsh1993@gmail.com manziliga yozing.<\/p>\n<p>8.2. Oʻchirilgandan soʻng darhol:<\/p>\n<ul><li>ism «Oʻchirilgan foydalanuvchi»ga almashtiriladi, telefon raqami va rasm oʻchiriladi;<\/li><li>xabarlaringizdagi matnlar, rasmlar va ovozlilar, reaksiyalaringiz, qoʻllab-quvvatlash bilan yozishma oʻchiriladi;<\/li><li>sharhlaringizning matni va rasmlari, shikoyatlaringiz matni oʻchiriladi;<\/li><li>ijrochi anketasi, geolokatsiya, saqlangan manzillar, tanlanganlar, bildirishnomalar, push-token, Telegram ulanishi oʻchiriladi;<\/li><li>buyurtmalaringizda uy raqami, xonadon, izohlar, rasmlar va ovozli xabarlar oʻchiriladi;<\/li><li>qurilmalardagi barcha sessiyalar yakunlanadi.<\/li><\/ul>\n<p>8.3. Buyurtmalar haqidagi shaxsiylashtirilmagan yozuvlar (toifa, sana, tuman va koʻcha, holat, narx) va matnsiz yulduzli baho qoladi. Ular buyurtmaning ikkinchi tomoniga tarix va nizolar uchun hamda Ijrochi reytingi toʻgʻri boʻlishi uchun kerak.<\/p>\n<p>8.4. Agar akkaunt jiddiy qoidabuzarlik uchun bloklangan boʻlsa, qayta roʻyxatdan oʻtishning oldini olish uchun telefon raqamining qaytarib boʻlmaydigan xeshi saqlanadi.<\/p>\n<p>8.5. Agar siz Ijrochi boʻlgan boʻlsangiz, telefon raqamining qaytarib boʻlmaydigan xeshi va Ijrochining shaxssizlashtirilgan tarixi (reyting, matnsiz sharhlar, bajarilgan va bekor qilingan buyurtmalar, buyurtma qabul qilishdagi pauza) saqlanadi: 60 kun, agar oʻchirish paytida reyting 4.0 dan past, ishonchlilik 70% dan past boʻlgan, pauza amal qilgan yoki mijozlardan shikoyatlar boʻlgan boʻlsa — 12 oy. Shu muddatda xuddi shu raqam bilan qayta roʻyxatdan oʻtsangiz, Ijrochi tarixi akkauntingizga qaytadi; qoidabuzarliklar boʻlgan holatda ijrochi rejimi oʻchirilgandan 30 kun oʻtib ochiladi. Bu mijozlarni akkauntni oʻchirish orqali reytingni «nolga tushirish»dan himoya qiladi.<\/p>\n<p>8.6. Qoidabuzarlar qaytib kelmasligi uchun har qanday oʻchirilgan akkauntning telefon raqami qaytarib boʻlmaydigan xeshi 12 oy saqlanadi. Agar akkaunt jiddiy qoidabuzarlik uchun bloklangan boʻlsa, raqam xeshi bilan birga uning telefonidagi ilova oʻrnatilishining tasodifiy identifikatori ham saqlanadi: shu telefondan boshqa akkauntga kirishni moderator tekshiradi.<\/p>\n<h3>9. Huquqlaringiz<\/h3>\n<p>Siz quyidagilarga haqlisiz:<\/p>\n<ul><li>qaysi maʻlumotlaringiz va qanday qayta ishlanishini bilish;<\/li><li>ularni tuzatish yoki yangilash (koʻpchiligini — bevosita Profilda);<\/li><li>rozilikni qaytarib olish va akkauntni oʻchirish;<\/li><li>noqonuniy qayta ishlashni toʻxtatishni talab qilish;<\/li><li>Operator harakatlari ustidan vakolatli davlat organiga yoki sudga shikoyat qilish.<\/li><\/ul>\n<p>Soʻrovlarni ilovadagi qoʻllab-quvvatlash orqali yoki emhsh1993@gmail.com manziliga yuboring. Maʻlumotlaringizni himoya qilish uchun akkaunt egasi ekanligingizni tasdiqlashni soʻrashimiz mumkin. Javob — qonunchilikda belgilangan muddatlarda.<\/p>\n<h3>10. Yosh<\/h3>\n<p>Platforma 18 yoshdan oshgan shaxslar uchun moʻljallangan. Akkaunt voyaga yetmagan shaxs tomonidan yaratilganini bilsak, u oʻchiriladi.<\/p>\n<h3>11. Oʻzgarishlar va aloqa<\/h3>\n<p>Funksiyalar, hamkorlar yoki qonunchilik oʻzgarganda Siyosatni tahrir raqami va sanasini koʻrsatib yangilaymiz. Muhim oʻzgarishlar haqida ilovada xabar beramiz.<\/p>\n<p>Shaxsiy maʻlumotlar boʻyicha savollar: ilovadagi qoʻllab-quvvatlash, emhsh1993@gmail.com, taskbor.uz.<\/p>", "EN|terms": "<p>Version: 2.1<\/p>\n<p>Effective date: 15 October 2026<\/p>\n<h3>1. Definitions<\/h3>\n<p>Platform — the TASK BOR mobile app for iOS and Android, the taskbor.uz website and related services, including the @taskborbot Telegram bot.<\/p>\n<p>Administration — the owner and operator of the Platform: Eldor Mukhsin ugli Murodov, e-mail: emhsh1993@gmail.com.<\/p>\n<p>User — an individual registered on the Platform.<\/p>\n<p>Client — a User who posts an Order.<\/p>\n<p>Executor — a User who has completed the executor profile and responds to Orders.<\/p>\n<p>Order — a Client&#x27;s request for a household or other permitted service.<\/p>\n<p>Order board — the section where an Order is visible to all suitable Executors nearby.<\/p>\n<p>Reliability — an Executor metric: the share of completed orders among accepted ones.<\/p>\n<h3>2. Acceptance<\/h3>\n<p>2.1. This Agreement is a public offer. It is accepted when the User ticks the consent box at registration and confirms their phone number with an SMS code.<\/p>\n<p>2.2. Without registration, the Platform can be browsed in guest mode: categories, service descriptions, executor profiles. Creating orders, responding, chat and reviews require registration.<\/p>\n<p>2.3. A User who does not agree with these terms must not register or use the Platform.<\/p>\n<h3>3. Role of the Platform<\/h3>\n<p>3.1. TASK BOR is an information platform that helps Clients and Executors find each other and agree on a service.<\/p>\n<p>3.2. The Administration is not a provider or customer of services, an employer, agent, guarantor or payment intermediary. The service agreement is made directly between the Client and the Executor.<\/p>\n<p>3.3. The scope, price, timing, quality and warranties of a service are determined by the Client and the Executor. The Administration is not liable for the performance of their arrangements, except where expressly required by law.<\/p>\n<p>3.4. The Platform does not accept, hold or transfer Users&#x27; money. Payment is made directly — in cash or by transfer, as the parties agree. The amount shown in the app is for reference only.<\/p>\n<p>3.5. The Platform is currently free and charges no commission. If paid features or a commission are introduced, the Administration will publish a new version of this Agreement in advance and notify Users in the app.<\/p>\n<h3>4. Account<\/h3>\n<p>4.1. The Platform may be used by persons aged 18 or over with full legal capacity.<\/p>\n<p>4.2. Sign-in is by phone number and a one-time SMS code. One number — one account. An account may not be transferred to another person.<\/p>\n<p>4.3. One account has two roles: Client and Executor, switched in Profile. To work as an Executor, the profile must be completed: photo, service categories, districts or work radius, rates, experience and description.<\/p>\n<p>4.4. The User is responsible for the accuracy of their data and for securing access to their phone. Never share your SMS code — TASK BOR staff will never ask for it.<\/p>\n<h3>5. How an Order works<\/h3>\n<p>5.1. The Client specifies the category, a task description and, optionally, photos and a voice message, the address (on the map), date and time. An Order can repeat weekly or every two weeks.<\/p>\n<p>5.2. Pricing:<\/p>\n<ul><li>Hourly — the Executor&#x27;s rate × hours, minimum 2 hours. The Executor enters the actual hours on completion.<\/li><li>Negotiated — the Client sets a price, the Executor accepts or declines. Counter-offers are not supported.<\/li><\/ul>\n<p>5.3. Ways to choose an executor:<\/p>\n<ul><li>On the map or from a list — the Client picks an Executor among those online nearby.<\/li><li>Any executor — the Order goes to the Order board. The first Executor to accept gets it.<\/li><\/ul>\n<p>5.4. Before accepting, the Executor sees the description, photos, voice message and an approximate location (about 300 m accuracy), without house or apartment number. After accepting, the Executor receives the exact address and the Client&#x27;s name and phone number, and the chat opens.<\/p>\n<p>5.5. If no one accepts an Order in time, it is removed automatically with the status &quot;Expired&quot;.<\/p>\n<p>5.6. Statuses: &quot;Accepted&quot; → &quot;On the way&quot; → &quot;In progress&quot; → &quot;Completed&quot;. Statuses reflect the arrangement but do not confirm the quality of work or payment.<\/p>\n<p>5.7. If an order &quot;In progress&quot; is not completed manually, both parties get a reminder one hour after the planned end, and after 24 hours the order is completed automatically at the planned price. For an hourly order, no more than the planned hours plus 2 hours are billable.<\/p>\n<p>5.8. If work on an accepted order is not started within 24 hours after the start time, the order is cancelled automatically. This does not affect the Executor&#x27;s Reliability.<\/p>\n<h3>6. Cancellation<\/h3>\n<p>6.1. The Client may cancel an Order, stating a reason.<\/p>\n<p>6.2. Before accepting, the Executor may simply decline. After accepting, the Executor sends a cancellation request with a reason, and the Client decides whether to cancel or keep the Order.<\/p>\n<p>6.3. A cancellation less than 2 hours before the start is considered late and is recorded in the history.<\/p>\n<p>6.4. Executor cancellations count towards the Reliability metric. It appears in the profile after 5 accepted orders and affects the order of lists. Completed orders are counted across different Clients: repeat orders from the same Client within a month count once. Cancellations do not affect the star rating.<\/p>\n<p>6.5. In case of repeated cancellations or no-shows, the Administration may suspend the Executor from receiving orders (section 12).<\/p>\n<h3>7. Chat<\/h3>\n<p>7.1. Once an Order is accepted, the parties communicate in chat: text, photos, voice messages, reactions.<\/p>\n<p>7.2. A User may report a message (long press) and block the other party.<\/p>\n<p>7.3. Support and moderation staff may view the chat of a specific order only when handling a complaint, dispute, support request or safety threat.<\/p>\n<p>7.4. Photos and voice messages in the chat and in the order description are kept for 90 days after the order is closed, then deleted. The chat text is kept.<\/p>\n<h3>8. Reviews and rating<\/h3>\n<p>8.1. After an Order is completed, the Client may rate the Executor from 1 to 5 stars and leave a review with photos. The Executor&#x27;s star rating is the average of these ratings.<\/p>\n<p>8.2. If an Order was cancelled at the Executor&#x27;s request, the Client may leave a review. It is shown in the profile but not counted in the average rating.<\/p>\n<p>8.3. The Administration does not edit reviews. A review may be hidden only if it contains insults, threats, third-party personal data, advertising, knowingly false information or another breach of the law or this Agreement. The Executor may report a review via support.<\/p>\n<p>8.4. Paid reviews, reviews about oneself and reviews without a real order are prohibited.<\/p>\n<p>8.5. To keep ratings fair, the following do not count towards the average (but remain visible in the profile): repeat reviews by the same Client of the same Executor more than once in 30 days; reviews of orders where the Client and the Executor use the same phone; reviews of orders closed less than 15 minutes after acceptance or start of work.<\/p>\n<h3>9. How executors and orders are ranked<\/h3>\n<p>9.1. The list and the map show only Executors who are online now, work in the required category, in the Order&#x27;s district or radius, and are not suspended.<\/p>\n<p>9.2. List order: Executors with high Reliability (90% and above) first, then normal (80–89%) and new Executors, then low (below 80%). Within each group — by rating adjusted for the number of reviews and by proximity to the riod, or block the account.<\/p>\n<p>12.2. After a block for a serious violation, re-registration with the same number may be prohibited. For this, an irreversible hash of the number is stored, not the number itself.<\/p>\n<p>12.3. The reason for a restriction is shown in the app. Decisions can be appealed via support.<\/p>\n<p>12.4. A complaint can be filed from the order card, on a chat message, or via support. The Administration reviews it within a reasonable time and reports the outcome in the app. The Administration does not resolve civil disputes between the parties but may assist with information within the law.<\/p>\n<p>12.5. The Platform automatically flags suspicious activity (e.g. rating manipulation, several accounts on one phone, mass SMS requests) for review by staff. There are no automatic blocks — a staff member always makes the decision.<\/p>\n<h3>13. Safety<\/h3>\n<p>13.1. We recommend: do not pay before work starts unless agreed; check the rating, reviews and Reliability; communicate through the TASK BOR chat; never share SMS codes or card details.<\/p>\n<p>13.2. In case of a threat to life, health or property, call immediately: 101 — fire service, 102 — police, 103 — ambulance.<\/p>\n<h3>14. Liability<\/h3>\n<p>14.1. The Administration is liable for the operation of the Platform and its own actions within the limits set by the laws of the Republic of Uzbekistan.<\/p>\n<p>14.2. The Administration does not guarantee the availability of orders or executors, the quality, safety or timing of services, or payment.<\/p>\n<p>14.3. The Platform is provided &quot;as is&quot;. Interruptions for updates and maintenance are possible.<\/p>\n<p>14.4. Nothing in this Agreement limits liability that cannot be limited by law, or consumer rights.<\/p>\n<h3>15. Intellectual property<\/h3>\n<p>15.1. Rights to the Platform, its design, code, the TASK BOR name and logo belong to the Administration.<\/p>\n<p>15.2. By posting photos, descriptions and reviews, the User grants the Administration a free, non-exclusive licence to use them for operating the Platform — display in the app, in the Executor&#x27;s profile, and moderation — for as long as they are posted. Advertising outside the app requires separate consent.<\/p>\n<h3>16. Changes and account deletion<\/h3>\n<p>16.1. The Administration may amend this Agreement when features or laws change. Users will be notified of material changes in the app at least 7 days in advance. Continued use means acceptance of the new version.<\/p>\n<p>16.2. The User may delete their account at any time: Profile → Delete account. What happens to the data is described in the Privacy Policy.<\/p>\n<h3>17. Governing law and contacts<\/h3>\n<p>17.1. This Agreement is governed by the laws of the Republic of Uzbekistan.<\/p>\n<p>17.2. Disputes with the Administration are first resolved by a written claim sent by e-mail. If unresolved, they are referred to court under the laws of the Republic of Uzbekistan.<\/p>\n<p>17.3. Contacts: in-app support (Profile → Support), e-mail emhsh1993@gmail.com, website taskbor.uz.<\/p>", "EN|privacy": "<p>Version: 2.1<\/p>\n<p>Effective date: 15 October 2026<\/p>\n<h3>1. Who processes the data<\/h3>\n<p>The personal data operator and owner is Eldor Mukhsin ugli Murodov (TASK BOR), e-mail: emhsh1993@gmail.com.<\/p>\n<p>This Policy applies to the TASK BOR app, the taskbor.uz website and the @taskborbot Telegram bot. It is drawn up in accordance with the Law of the Republic of Uzbekistan &quot;On Personal Data&quot;.<\/p>\n<h3>2. What we collect<\/h3>\n<p>At registration: phone number, name, interface language, consent record (date, document version, language).<\/p>\n<p>Profile: photo (optional).<\/p>\n<p>Executor profile: categories, districts or work radius, rates, experience, description, online/offline status.<\/p>\n<p>Executor location: while the Executor is online and the app is open, coordinates are updated to match orders by radius and show distance. Background tracking is not used.<\/p>\n<p>Addresses: order address (district, street, house, apartment, landmark, comment, map point), saved addresses.<\/p>\n<p>Orders: category, description, photos, voice message, date and time, price, statuses, cancellation reasons.<\/p>\n<p>Communication: chat messages (text, photos, voice), reactions, support conversations.<\/p>\n<p>Reviews and complaints: ratings, texts, photos, complaint reasons and descriptions.<\/p>\n<p>Other: favourite executors, blocked users, notification history.<\/p>\n<p>Technical data: push notification token, IP address, device model, a random app installation ID (so the account stays signed in on only one phone), OS and app version, sign-in and activity logs needed for security, technical crash reports from the app and the server. If an Executor has linked the Telegram bot — the Telegram chat ID.<\/p>\n<p>We do NOT collect: bank card details, passport data, phone book contacts, background location, advertising ID. The app contains no third-party analytics or ad trackers. Voice messages are not used for biometric identification.<\/p>\n<h3>3. Device permissions<\/h3>\n<p>All permissions are optional and requested only when a feature is used. They can be turned off in phone settings.<\/p>\n<ul><li>Location (&quot;while using&quot;) — order point on the map, executors nearby, Executor working online.<\/li><li>Camera and gallery — photos of a task, profile, review or in chat.<\/li><li>Microphone — only while recording a voice message.<\/li><li>Notifications — new orders, statuses, messages.<\/li><\/ul>\n<h3>4. Why we do this<\/h3>\n<ul><li>registration and sign-in;<\/li><li>creating orders, matching and showing executors and orders nearby, running the order board;<\/li><li>chat, notifications, support;<\/li><li>rating, reviews, the Reliability metric;<\/li><li>handling complaints and disputes, moderation, protection against fraud and re-registration of violators;<\/li><li>automated checks for rating manipulation and spam (e.g. the Client and the Executor using the same phone) — a staff member always makes the decision;<\/li><li>stability and security of the Platform;<\/li><li>compliance with legal requirements.<\/li><\/ul>\n<p>We do not sell personal data and do not use it for advertising.<\/p>\n<p>Legal grounds: the User&#x27;s consent, performance of the Agreement, legal requirements, and protection of the rights and legitimate interests of Users and the Operator.<\/p>\n<h3>5. Who sees your data<\/h3>\n<p>Other Users:<\/p>\n<ul><li>Everyone can see an Executor&#x27;s profile: name, photo, categories, rates, experience, description, rating, Reliability, reviews.<\/li><li>Before accepting an order, the Executor sees the description, photos, voice message and an approximate point (about 300 m), without house or apartment.<\/li><li>After accepting, the Executor sees the exact address and the Client&#x27;s name and phone number.<\/li><li>The Client sees the approximate distance to the Executor. The Executor&#x27;s exact coordinates are not shared with the Client. The Executor&#x27;s phone number is not shown to the Client — communication goes through the chat.<\/li><li>A review is shown in the Executor&#x27;s profile together with the Client&#x27;s name.<\/li><\/ul>\n<p>TASK BOR staff (owner, moderators, support) — role-based access, limited to what their work requires. Staff actions are logged.<\/p>\n<p>Technical partners — only to run the service:<\/p>\n<ul><li>Supabase — database, storage of photos and voice messages (Singapore);<\/li><li>Render — application server (Singapore);<\/li><li>Eskiz.uz — sending SMS codes (Uzbekistan);<\/li><li>Expo, Google Firebase, Apple — push notification delivery (USA);<\/li><li>Sentry (Functional Software, Inc.) — app and server crash diagnostics: technical error description, device model, OS and app version, internal user ID; name, phone number and chats are not shared (data stored in the EU);<\/li><li>Google Maps (Android), Apple Maps (iOS) — map display and address lookup by point (USA);<\/li><li>Telegram — order notifications, if the Executor has linked the bot.<\/li><\/ul>\n<p>Government authorities — only on request and in the manner prescribed by law.<\/p>\n<h3>6. Storage abroad and security<\/h3>\n<p>6.1. Some data is stored on servers outside Uzbekistan (see section 5). This is permitted by the laws of the Republic of Uzbekistan subject to information security requirements. The Platform does not process biometric or genetic data.<\/p>\n<p>6.2. Security measures: encrypted connections (HTTPS), sign-in codes stored only as a hash valid for 2 minutes, secure storage of the session token on the device, limits on attempts and requests, role-based staff access with an action log, and hiding the exact address until an order is accepted.<\/p>\n<p>6.3. No method of transmitting or storing data is completely secure. In the event of a breach affecting your rights, we will notify you and the competent authority as required by law.<\/p>\n<h3>7. Retention<\/h3>\n<ul><li>Account data is kept as long as the account exists.<\/li><li>SMS code — 2 minutes.<\/li><li>SMS sending log — 7 days.<\/li><li>In-app notifications — 90 days.<\/li><li>Photos and voice messages in the chat and in the order description — 90 days after the order is closed. Review and profile photos are kept as long as the account exists.<\/li><li>Backups are overwritten on the provider&#x27;s cycle.<\/li><\/ul>\n<h3>8. Account deletion<\/h3>\n<p>8.1. You can delete your account in the app (Profile → Delete account) or via taskbor.uz/delete-account.html. If you cannot access the app, write to emhsh1993@gmail.com from the number linked to the account.<\/p>\n<p>8.2. Immediately after deletion:<\/p>\n<ul><li>your name is replaced with &quot;Deleted user&quot;, your phone number and photo are removed;<\/li><li>texts, photos and voice in your messages, your reactions and your support conversation are deleted;<\/li><li>the text and photos of your reviews and the text of your complaints are deleted;<\/li><li>your executor profile, location, saved addresses, favourites, notifications, push token and Telegram link are deleted;<\/li><li>in your orders, the house number, apartment, notes, photos and voice messages are deleted;<\/li><li>all sessions on your devices are ended.<\/li><\/ul>\n<p>8.3. Anonymised order records (category, date, district and street, status, price) and the star rating without text remain. The other party needs them for history and disputes, and they keep the Executor&#x27;s rating accurate.<\/p>\n<p>8.4. If the account was blocked for a serious violation, an irreversible hash of the phone number is kept to prevent re-registration.<\/p>\n<p>8.5. If you were an Executor, we keep an irreversible hash of your phone number and your anonymised Executor history (rating, reviews without text, completed and cancelled orders, order-taking pause): for 60 days, or for 12 months if at deletion your rating was below 4.0, reliability below 70%, a pause was active or there were client complaints. If you register again with the same number within that period, your Executor history returns to your account; in the case of violations, executor mode opens 30 days after deletion. This protects clients from ratings being “reset” by deleting the account.<\/p>\n<p>8.6. To keep violators from coming back, an irreversible hash of the phone number of any deleted account is kept for 12 months. If an account is blocked for a serious violation, a random identifier of the app installation on that phone is kept with the number hash: a moderator reviews sign-ins of another account from that phone.<\/p>\n<h3>9. Your rights<\/h3>\n<p>You have the right to:<\/p>\n<ul><li>know which of your data is processed and how;<\/li><li>correct or update it (most of it directly in Profile);<\/li><li>withdraw consent and delete your account;<\/li><li>demand that unlawful processing stop;<\/li><li>appeal the Operator&#x27;s actions to the competent authority or court.<\/li><\/ul>\n<p>Send requests through in-app support or to emhsh1993@gmail.com. To protect your data, we may ask you to confirm that you own the account. We respond within the time limits set by law.<\/p>\n<h3>10. Age<\/h3>\n<p>The Platform is intended for persons aged 18 or over. If we learn that an account was created by a minor, it will be deleted.<\/p>\n<h3>11. Changes and contacts<\/h3>\n<p>When features, partners or laws change, we update this Policy and indicate the version number and date. We announce material changes in the app.<\/p>\n<p>Personal data questions: in-app support, emhsh1993@gmail.com, taskbor.uz.<\/p>"};

/* язык: ?lang=, затем выбор на сайте (taskbor_lang), затем язык браузера */
const TITLES={"RU": "TASK BOR — условия использования и политика конфиденциальности", "UZ": "TASK BOR — foydalanish shartlari va maxfiylik siyosati", "EN": "TASK BOR — terms of use and privacy policy"};
function pickLang(){
  const q=(location.search.match(/[?&]lang=(ru|uz|en)/i)||[])[1]; if(q) return q.toUpperCase();
  try{const v=localStorage.getItem('taskbor_lang'); if(v&&/^(ru|uz|en)$/.test(v)) return v.toUpperCase();}catch(e){}
  const n=(navigator.language||'ru').slice(0,2).toLowerCase(); return n==='uz'?'UZ':n==='en'?'EN':'RU';
}
function saveLang(){try{localStorage.setItem('taskbor_lang',lang.toLowerCase())}catch(e){}}
lang=pickLang();
document.querySelectorAll('.langs button').forEach(x=>x.classList.toggle('on',x.dataset.lang===lang));
document.querySelectorAll('.langs button').forEach(b=>b.onclick=()=>{
  lang=b.dataset.lang; saveLang();
  document.querySelectorAll('.langs button').forEach(x=>x.classList.toggle('on',x===b));
  render();
});
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  doc=b.dataset.doc;
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  render();
  window.scrollTo({top:document.querySelector('main').offsetTop-90,behavior:'smooth'});
});
