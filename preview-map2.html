<style>
:root{
  --green:#0F5B3A; --green-2:#137049; --green-d:#0B3D28; --mint:#E7F2EB; --mint-2:#D4EADB; --lime:#C6F06B;
  --gold:#F5B301; --gold-d:#C98A00; --gold-soft:#FFF4D1; --gold-ink:#1A1300;
  --bg:#F5F7F4; --card:#fff; --ink:#0D2619; --muted:#5B6F64; --line:rgba(13,38,25,.09);
  --side:20px; --max:1180px;
  --acc:var(--green); --acc-soft:var(--mint); --acc-ink:#fff;
}
body.m{--acc:var(--gold); --acc-soft:var(--gold-soft); --acc-ink:var(--gold-ink)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--side)}
.note{background:var(--ink);color:#fff;font-size:13px;text-align:center;padding:8px 16px}
header{position:sticky;top:0;z-index:50;background:rgba(245,247,244,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.bar{display:flex;align-items:center;justify-content:space-between;height:64px;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.02em}
.brand img{width:34px;height:34px;border-radius:10px}
.langs{display:flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px}
.langs button{min-width:38px;height:32px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted)}
.langs button[aria-pressed="true"]{background:var(--green);color:#fff}

.mh{padding:clamp(20px,4vw,56px) 0 clamp(40px,6vw,80px);position:relative;overflow:hidden}
.mh::before{content:"";position:absolute;right:-20%;top:-30%;width:900px;height:900px;background:radial-gradient(closest-side,rgba(198,240,107,.32),transparent 70%);z-index:-1;pointer-events:none}
.grid{display:grid;grid-template-columns:1fr 1.05fr;gap:clamp(24px,4vw,56px);align-items:center;grid-template-areas:"copy map" "stores map"}
.copy{grid-area:copy;align-self:end}
.stores-wrap{grid-area:stores;align-self:start}
.mapcard{grid-area:map}

.sw{position:relative;display:inline-grid;grid-template-columns:1fr 1fr;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px;box-shadow:0 6px 18px -10px rgba(13,38,25,.25)}
.sw button{position:relative;z-index:1;height:42px;padding:0 18px;border-radius:999px;font-weight:800;font-size:15px;color:var(--muted);transition:color .3s;white-space:nowrap}
.sw button[aria-pressed="true"]{color:var(--acc-ink)}
.sw .th{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;background:var(--acc);transition:transform .45s cubic-bezier(.2,.8,.2,1),background .45s}
body.m .sw .th{transform:translateX(100%)}

.kicker{display:inline-flex;align-items:center;gap:8px;margin-top:26px;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--green);transition:color .4s}
body.m .kicker{color:var(--gold-d)}
.kicker::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 0 4px var(--acc-soft)}
h1{font-size:clamp(38px,5.6vw,68px);letter-spacing:-.035em;line-height:1.04;font-weight:800;margin:14px 0 16px}
h1 em{font-style:normal;position:relative;white-space:nowrap;color:var(--green);transition:color .4s}
body.m h1 em{color:var(--gold-ink)}
h1 em::after{content:"";position:absolute;left:0;right:0;bottom:.06em;height:.24em;background:var(--lime);z-index:-1;border-radius:4px;transition:background .4s}
body.m h1 em::after{background:var(--gold)}
.lead{font-size:clamp(17px,1.6vw,19px);color:var(--muted);max-width:520px}
.swap{transition:opacity .28s,transform .28s}
.swap.out{opacity:0;transform:translateY(6px)}

.stores{display:flex;flex-wrap:wrap;gap:12px}
.store{display:flex;align-items:center;gap:12px;height:58px;padding:0 20px 0 16px;border-radius:16px;background:var(--ink);color:#fff;min-width:190px;position:relative}
.store svg{width:26px;height:26px;flex:none}
.store small{display:block;font-size:11px;opacity:.7;line-height:1.1}
.store b{display:block;font-size:17px;line-height:1.15}
.store .tag{position:absolute;top:-8px;right:-6px;background:var(--lime);color:var(--ink);font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px}

.mapcard{position:relative;border-radius:28px;background:linear-gradient(160deg,#EEF6F0,#E3EFE7);box-shadow:0 30px 80px -24px rgba(6,40,26,.35),0 12px 30px -12px rgba(6,40,26,.18);overflow:hidden;aspect-ratio:1/1.02;isolation:isolate}
.mapcard::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(15,91,58,.10) 1px,transparent 1.2px);background-size:16px 16px;z-index:-1}
#map{position:absolute;inset:0}
#map .maplibregl-canvas{outline:none}
#ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.mapcard .top,.mapcard .toast,.mapcard .attr{z-index:3}
.lmk{display:flex;align-items:center;gap:5px;font:700 11px Manrope,sans-serif;color:#0B3D28;white-space:nowrap;pointer-events:none}
.lmk i{width:24px;height:24px;border-radius:50%;background:#fff;border:1.6px solid #0F5B3A;display:grid;place-items:center;box-shadow:0 2px 6px rgba(13,38,25,.18)}
.lmk i svg{width:16px;height:16px;overflow:visible}
.lmk span{background:rgba(255,255,255,.88);padding:1px 6px;border-radius:6px}
.zone{fill:var(--acc);opacity:.10;transition:fill .5s}
.zone2{fill:none;stroke:var(--acc);stroke-width:1.5;stroke-dasharray:4 5;opacity:.5}
.top{position:absolute;left:14px;right:14px;top:14px;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:16px;padding:10px 14px;box-shadow:0 6px 18px -10px rgba(13,38,25,.3)}
.top .dot{width:10px;height:10px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 0 var(--acc);animation:live 1.8s infinite;flex:none}
@keyframes live{0%{box-shadow:0 0 0 0 rgba(15,91,58,.45)}70%{box-shadow:0 0 0 10px rgba(15,91,58,0)}100%{box-shadow:0 0 0 0 rgba(15,91,58,0)}}
body.m .top .dot{animation-name:liveg}
@keyframes liveg{0%{box-shadow:0 0 0 0 rgba(245,179,1,.5)}70%{box-shadow:0 0 0 10px rgba(245,179,1,0)}100%{box-shadow:0 0 0 0 rgba(245,179,1,0)}}
.top b{font-size:14px;line-height:1.2}
.top small{display:block;font-size:12px;color:var(--muted);line-height:1.2}

.toast{position:absolute;left:14px;right:14px;bottom:30px;display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:12px 14px;box-shadow:0 18px 40px -14px rgba(6,40,26,.4);transform:translateY(130%);opacity:0;transition:transform .5s cubic-bezier(.2,.9,.2,1.1),opacity .35s}
.toast.show{transform:none;opacity:1}
.toast .ti{width:38px;height:38px;border-radius:12px;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;flex:none}
.toast .ti svg{width:20px;height:20px}
.toast b{display:block;font-size:15px;line-height:1.25}
.toast small{display:block;font-size:13px;color:var(--muted);line-height:1.3}
.attr{position:absolute;right:10px;bottom:6px;font-size:9.5px;color:rgba(13,38,25,.55)}
.attr a{text-decoration:underline}

/* scene items */
.it{opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .35s,transform .45s cubic-bezier(.2,.9,.25,1.35)}
.it.in{opacity:1;transform:none}
.it.dim{opacity:.35}
.it.hl{transform:scale(1.18)}
.av{stroke:#fff;stroke-width:3}
.avt{font:800 14px Manrope,sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:central}
.pill{fill:#fff;stroke:var(--line);stroke-width:1}
.pt{font:700 12px Manrope,sans-serif;fill:var(--ink);dominant-baseline:central}
.pt .s{fill:#E39A00}
.ord{fill:var(--gold);stroke:#fff;stroke-width:2.5}
.ordt{font:800 12px Manrope,sans-serif;fill:var(--gold-ink);dominant-baseline:central}
.route{fill:none;stroke:var(--acc);stroke-width:3;stroke-linecap:round;stroke-dasharray:6 7}
.ring{fill:none;stroke:var(--acc);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite;opacity:0}
.ring.r2{animation-delay:.8s}.ring.r3{animation-delay:1.6s}
@keyframes ring{0%{transform:scale(.3);opacity:.6}100%{transform:scale(3.2);opacity:0}}
.home{transform-box:fill-box;transform-origin:50% 100%;animation:drop .6s cubic-bezier(.2,.9,.25,1.4) both}
@keyframes drop{0%{transform:translateY(-40px) scale(.6);opacity:0}100%{transform:none;opacity:1}}

@media (max-width:860px){
  .grid{grid-template-columns:1fr;grid-template-areas:"copy" "map" "stores";gap:22px}

  .mapcard{aspect-ratio:1/1.3}
  .toast{bottom:24px;padding:10px 12px}.toast b{font-size:14px}.toast small{font-size:12px}
  .store{flex:1 1 100%;min-width:0}
  h1{margin:10px 0 10px}
  .kicker{margin-top:18px}
}
@media (prefers-reduced-motion:reduce){.ring,.top .dot{animation:none}.it,.toast,.swap{transition:none}}
</style>

        if(!/water/.test(id))map.setPaintProperty(id,'text-color',/road|street|highway/.test(id)?'#6F8277':'#3E5448');
      }
    }catch(e){}
  });
}
function initMap(){
  if(!window.maplibregl)return;
  try{var tc=document.createElement('canvas');if(!(tc.getContext('webgl2')||tc.getContext('webgl')))return}catch(e){return}
  var c=SCN[SCENES[step%SCENES.length][0]], b=box();
  try{map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/positron',center:c,zoom:14.2,
    interactive:false,attributionControl:false,fadeDuration:0,pitchWithRotate:false})}catch(e){map=null;return}
  map.setPadding({top:b.top,bottom:b.bot,left:0,right:0});
  map.on('style.load',function(){mapOK=true;tint()});
  Object.keys(LMS).forEach(function(k){var d=document.createElement('div');d.className='lmk';
    d.innerHTML='<i><svg viewBox="-9 -9 18 18" fill="none" stroke="#0F5B3A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'+LMI[k]+'</svg></i><span></span>';
    lmEls[k]=d.querySelector('span');
    new maplibregl.Marker({element:d,anchor:'left',offset:[-12,0]}).setLngLat(LMS[k]).addTo(map);});
  texts();
}
function zoomTo(code){
  if(!map)return; var b=box(); map.setPadding({top:b.top,bottom:b.bot,left:0,right:0});
  var c=SCN[code];
  if(reduce)map.jumpTo({center:c,zoom:14.2});else map.flyTo({center:c,zoom:14.2,duration:2400,curve:1.35,essential:true});
}
function later(fn,ms){timers.push(setTimeout(fn,reduce?Math.min(ms,50):ms))}
function clearTimers(){timers.forEach(clearTimeout);timers=[]}

var ICON={c:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
          m:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>'};

function texts(){
  var t=T[lang], r=t[role];
  $('bC').textContent=t.bC; $('bM').textContent=t.bM;
  $('k').textContent=r.k; $('h1').textContent=r.h1; $('h2').textContent=r.h2; $('p').textContent=r.p;
  $('cap').textContent=r.cap; $('note').textContent=t.note;
  if(map&&mapOK)tint();
  Object.keys(lmEls).forEach(function(k){if(lmEls[k])lmEls[k].textContent=t.lm[k]});
  var items=[['i-apple','App Store'],['i-play','Google Play']];
  $('stores').innerHTML=items.map(function(it){return '<div class="store"><svg aria-hidden="true"><use href="#'+it[0]+'"/></svg><span><small>'+t.onSoon+'</small><b>'+it[1]+'</b></span><span class="tag">'+t.soon+'</span></div>'}).join('');
}

function setRole(r,anim){
  if(r===role&&anim)return;
  role=r; document.body.classList.toggle('m',r==='m');
  $('bC').setAttribute('aria-pressed',r==='c'); $('bM').setAttribute('aria-pressed',r==='m');
  var sw=$('swap');
  if(anim&&!reduce){sw.classList.add('out');setTimeout(function(){texts();sw.classList.remove('out')},260)} else texts();
}

var tok=0;
function scene(){
  clearTimers(); var my=++tok;
  var sc=SCENES[step%SCENES.length], code=sc[0];
  setRole(userRole||sc[1],true);
  var dn=DN[code], li=lang==='ru'?3:lang==='uz'?4:5;
  $('where').textContent=dn[li];
  $('toast').classList.remove('show');
  gs.querySelectorAll('.it,.home,.zg').forEach(function(n){n.style.transition='opacity .3s';n.style.opacity=0});
  later(function(){gs.innerHTML='';zoomTo(code)},320);
  later(function(){if(my===tok)build(code)},reduce?400:2600);
}
function build(code){
  var t=T[lang], b=box(); ov.setAttribute('viewBox','0 0 '+b.W+' '+b.H);
  var vbT=[0,0,b.W,b.H], cx=b.W/2, cy=(b.top+(b.H-b.bot))/2+14;
  var dn=DN[code], li=lang==='ru'?3:lang==='uz'?4:5, d={'in':{}}; d['in'][lang]=dn[li];
  var zg=el('g',{'class':'zg'},gs); el('circle',{cx:cx,cy:cy-14,r:Math.min(b.W,b.H)*0.36,'class':'zone'},zg); el('circle',{cx:cx,cy:cy-14,r:Math.min(b.W,b.H)*0.36,'class':'zone2'},zg);
  // home / you pin + rings
  var rings=el('g',{},gs);
  ['','r2','r3'].forEach(function(c){el('circle',{cx:cx,cy:cy,r:22,'class':'ring '+c},rings)});
  var home=el('g',{'class':'home'},gs);
  el('path',{d:'M'+cx+','+(cy+2)+'c-10-12-17-18-17-27a17 17 0 0 1 34 0c0 9-7 15-17 27z',fill:role==='c'?'#0F5B3A':'#F5B301',stroke:'#fff','stroke-width':3},home);
  if(role==='c') el('path',{d:'M'+(cx-7)+','+(cy-22)+'l7-6 7 6v8h-14z',fill:'#fff'},home);
  else el('circle',{cx:cx,cy:cy-25,r:5.5,fill:'#1A1300'},home);

  var narrow=b.W<520, n=narrow?4:5, items=[];
  var X0=10, X1=b.W-10, Y0=b.top+22, Y1=b.H-b.bot-18;
  function cl(v,a,b){return Math.max(a,Math.min(b,v))}
  var up=Math.ceil(n/2), dn=n-up, ys=[];
  for(var u=0;u<up;u++) ys.push(up===1?(Y0+cy-60)/2:Y0+(cy-60-Y0)*u/(up-1));
  for(var v=0;v<dn;v++) ys.push(dn===1?(cy+30+Y1)/2:cy+30+(Y1-cy-30)*v/(dn-1));
  for(var i=0;i<n;i++){
    var side=((i+step)%2)?1:-1, off=26+((i*53+step*17)%Math.max(30,b.W*0.14));
    var x=cx+side*off, y=ys[i], a=side>0?0:Math.PI;
    var g=el('g',{'class':'it'},gs), right=side>0;
    if(role==='c'){
      var ni=(i+step)%6, name=t.names[ni];
      var label=name+'  ★'+RAT[ni];
      var w=label.length*7.2+18; x=cl(x,X0+19,X1-19); right=side>0?(x+22+w<=X1):(x-22-w<X0); var lx=right?x+22:x-22-w;
      el('circle',{cx:x,cy:y,r:17,fill:AVC[ni],'class':'av'},g);
      el('text',{x:x,y:y+0.5,'class':'avt'},g).textContent=name.charAt(0);
      el('rect',{x:lx,y:y-12,width:w,height:24,rx:12,'class':'pill'},g);
      var tx=el('text',{x:lx+9,y:y+0.5,'class':'pt'},g);
      tx.appendChild(document.createTextNode(name+'  '));
      var s=el('tspan',{'class':'s'},tx); s.textContent='★ '+RAT[ni];
      items.push({g:g,x:x,y:y,name:name,ni:ni});
    } else {
      var o=ORD[(i+step)%ORD.length], txt=t.cats[o[0]]+' · '+t.sum(o[1]);
      var w2=txt.length*6.9+30, lx2=cl(right?x-12:x-w2+12,X0,X1-w2); x=right?lx2+12:lx2+w2-12;
      el('rect',{x:lx2,y:y-13,width:w2,height:26,rx:13,'class':'ord'},g);
      el('circle',{cx:right?lx2+13:lx2+w2-13,cy:y,r:4,fill:'#1A1300'},g);
      el('text',{x:right?lx2+23:lx2+11,y:y+0.5,'class':'ordt'},g).textContent=txt;
      items.push({g:g,x:x,y:y,o:o});
    }
  }
  items.forEach(function(it,i){later(function(){it.g.classList.add('in')},250+i*220)});
  // pick nearest
  var best=items.slice().sort(function(a,b){return Math.hypot(a.x-cx,a.y-cy)-Math.hypot(b.x-cx,b.y-cy)})[0];
  later(function(){
    items.forEach(function(it){if(it!==best)it.g.classList.add('dim')});
    best.g.classList.add('hl');
    var path=el('path',{d:'M'+best.x+','+best.y+' Q'+((best.x+cx)/2+30)+','+((best.y+cy)/2-30)+' '+cx+','+(cy-20),'class':'route'},gs);
    gs.insertBefore(path,zg.nextSibling);
    if(!reduce&&path.getTotalLength){var L=path.getTotalLength();path.style.strokeDasharray=L;path.style.strokeDashoffset=L;path.getBoundingClientRect();path.style.transition='stroke-dashoffset .9s ease';path.style.strokeDashoffset=0;
      setTimeout(function(){path.style.transition='';path.style.strokeDasharray='6 7';path.style.strokeDashoffset=0},950)}
  },2200);
  later(function(){
    var r=T[lang][role];
    $('ti').innerHTML=ICON[role]; $('tb').textContent=r.tb;
    if(role==='c') $('ts').textContent=best.name+' ★'+RAT[best.ni]+' · '+T[lang].cats[step%5]+' · '+d['in'][lang];
    else $('ts').textContent=T[lang].cats[best.o[0]]+' · '+T[lang].sum(best.o[1])+' · '+T[lang].km(best.o[2]);
    $('toast').classList.add('show');
  },3000);
  later(function(){step++;scene()},6200);
}

$('bM').addEventListener('click',function(){userRole='m';step++;scene()});
function store(){try{return window.localStorage}catch(e){return null}}

  document.querySelectorAll('.langs button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.lang===l)});
  texts(); var s=store();try{s&&s.setItem('taskbor_lang',l)}catch(e){}
  var dn=DN[SCENES[step%SCENES.length][0]]; $('where').textContent=dn[l==='ru'?3:l==='uz'?4:5]; }
document.querySelectorAll('.langs button').forEach(function(b){b.addEventListener('click',function(){applyLang(b.dataset.lang)})});
(function(){var q=(location.search.match(/[?&]lang=(ru|uz|en)/)||[])[1];var s=store(),v=null;try{v=s&&s.getItem('taskbor_lang')}catch(e){}
  var n=(navigator.language||'ru').slice(0,2).toLowerCase(); applyLang(q||(v&&T[v]?v:(n==='uz'?'uz':n==='en'?'en':'ru')));})();
// pause when tab hidden
document.addEventListener('visibilitychange',function(){if(document.hidden){clearTimers();tok++}else scene()});
var rz,lastW=window.innerWidth;window.addEventListener('resize',function(){if(Math.abs(window.innerWidth-lastW)<2)return;lastW=window.innerWidth;clearTimeout(rz);rz=setTimeout(function(){if(map)map.resize();scene()},250)});
var sc=document.createElement('script');sc.src='vendor/maplibre/maplibre-gl.js';sc.onload=function(){initMap();scene()};sc.onerror=function(){scene()};
document.head.appendChild(sc);
</script>
